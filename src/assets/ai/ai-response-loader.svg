<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 32 32" aria-hidden="true">
  <style>
    .ai-loader-comet {
      transform: rotate(-32deg);
      animation: ai-loader-orbit 1s linear infinite;
    }

    .ai-loader-core {
      transform-origin: 16px 16px;
      animation: ai-loader-breathe 1.45s ease-in-out infinite;
    }

    @keyframes ai-loader-orbit {
      from { transform: rotate(-32deg); }
      to   { transform: rotate(328deg); }
    }

    @keyframes ai-loader-breathe {
      0%, 100% { transform: scale(.96); }
      42%      { transform: scale(1.045); }
      67%      { transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ai-loader-comet, .ai-loader-core { animation: none; }
    }
  </style>

  <defs>
    <linearGradient id="ai-loader-trail" x1="-7" y1="-10" x2="11.5" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A16EFF" stop-opacity="0"/>
      <stop offset=".33" stop-color="#AB76FA" stop-opacity=".42"/>
      <stop offset=".72" stop-color="#D693FF"/>
      <stop offset="1" stop-color="#FFB8AD"/>
    </linearGradient>
    <linearGradient id="ai-loader-track" x1="0" y1="-11.5" x2="0" y2="11.5" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A77CF2" stop-opacity=".21"/>
      <stop offset="1" stop-color="#BC90FF" stop-opacity=".41"/>
    </linearGradient>
  </defs>

  <g transform="translate(16 16) rotate(-32) scale(1.06 .73)">
    <circle r="11.5" fill="none" stroke="url(#ai-loader-track)" stroke-width=".85"/>
  </g>

  <g class="ai-loader-core">
    <path fill="#7441F5" d="M 13.55 9.78 C 14.45 13.92 16.32 15.74 20.47 16.81 C 16.32 17.88 14.45 19.7 13.55 23.84 C 12.65 19.7 10.78 17.88 6.63 16.81 C 10.78 15.74 12.65 13.92 13.55 9.78 Z"/>
    <path fill="#9B70FC" d="M 22.14 10.42 C 22.59 12.39 23.48 13.24 25.46 13.77 C 23.48 14.3 22.59 15.15 22.14 17.12 C 21.69 15.15 20.8 14.3 18.82 13.77 C 20.8 13.24 21.69 12.39 22.14 10.42 Z"/>
  </g>

  <g transform="translate(16 16) rotate(-32) scale(1.06 .73)">
    <g class="ai-loader-comet">
      <path d="M -7 -9.12 A 11.5 11.5 0 0 1 11.5 0" fill="none" stroke="url(#ai-loader-trail)" stroke-width="2.15" stroke-linecap="round"/>
      <ellipse cx="11.5" rx="1.27" ry="1.48" fill="#FFD4BE"/>
    </g>
  </g>
</svg>
