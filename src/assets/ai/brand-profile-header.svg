<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="160" viewBox="0 0 1920 160" preserveAspectRatio="none" role="img" aria-label="Nền trang trí tím nhạt cho tiêu đề Hồ sơ Brand cho AI">
